name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      # engines.node is >=20 and @types/node is pinned to ^20, so the floor is
      # what CI must prove.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

      # dist/ is committed (a prepare script would break `dsh plugin add
      # github:...`), so a rebuild must leave the tree clean.
      - run: pnpm run check:dist
